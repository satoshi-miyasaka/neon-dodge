<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ネオン・ドッジ</title>
<style>
  :root {
    --bg: #0a0a14;
    --grid: #1a1a2e;
    --accent: #00f0ff;
    --accent2: #ff2ee6;
    --warn: #ffce00;
    --text: #e8f7ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 9 / 16;
    max-height: 100vh;
    margin: 0 auto;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 0%, #12122a 0%, var(--bg) 70%);
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), inset 0 0 60px rgba(0,0,0,0.5);
  }
  #hud {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 18px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(0,240,255,0.6);
  }
  #score { color: var(--accent); }
  #best { color: var(--accent2); font-size: 14px; opacity: 0.85; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(5,5,15,0.78);
    border-radius: 12px;
    text-align: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 30px;
    color: var(--accent);
    text-shadow: 0 0 16px rgba(0,240,255,0.7);
    letter-spacing: 2px;
  }
  #overlay p {
    font-size: 14px;
    color: #a8c5d8;
    max-width: 320px;
    line-height: 1.6;
  }
  #overlay .sub {
    font-size: 22px;
    color: var(--accent2);
    text-shadow: 0 0 12px rgba(255,46,230,0.6);
  }
  button {
    margin-top: 8px;
    padding: 12px 34px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #05050f;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,240,255,0.5);
    transition: transform 0.1s ease;
  }
  button:active { transform: scale(0.94); }
  #hint {
    position: absolute;
    bottom: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #6a7fa0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="score">SCORE 0</div>
    <div id="best">BEST 0</div>
  </div>
  <div id="hint">← → または A / D、もしくはドラッグで移動</div>
  <div id="overlay">
    <h1>NEON DODGE</h1>
    <p>降ってくるブロックを避け続けろ。<br>時間が経つほどスピードが上がる。<br>何秒生き残れるか？</p>
    <button id="startBtn">スタート</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  const BEST_KEY = 'neonDodgeBest';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestEl.textContent = 'BEST ' + best;

  let player, blocks, particles, keys, running, elapsed, spawnTimer, spawnInterval, fallSpeed, score, shakeT;

  function resetGame() {
    player = { x: W / 2, w: 34, h: 14, targetX: W / 2 };
    blocks = [];
    particles = [];
    keys = { left: false, right: false };
    running = true;
    elapsed = 0;
    spawnTimer = 0;
    spawnInterval = 0.9;
    fallSpeed = 140;
    score = 0;
    shakeT = 0;
  }

  function spawnBlock() {
    const w = 26 + Math.random() * 46;
    const x = Math.random() * (W - w);
    const colorSet = [ '#00f0ff', '#ff2ee6', '#ffce00', '#7dff6a' ];
    blocks.push({
      x, y: -30, w, h: 16,
      speed: fallSpeed * (0.85 + Math.random() * 0.4),
      color: colorSet[Math.floor(Math.random() * colorSet.length)]
    });
  }

  function burst(x, y, color) {
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 160;
      particles.push({
        x, y,
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
        life: 0.5 + Math.random() * 0.4, t: 0, color
      });
    }
  }

  function update(dt) {
    elapsed += dt;
    score = Math.floor(elapsed * 10);

    if (shakeT > 0) shakeT -= dt;

    // difficulty ramp
    spawnInterval = Math.max(0.28, 0.9 - elapsed * 0.012);
    fallSpeed = 140 + elapsed * 9;

    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnBlock();
    }

    // player movement
    const moveSpeed = 480;
    if (keys.left) player.targetX -= moveSpeed * dt;
    if (keys.right) player.targetX += moveSpeed * dt;
    player.targetX = Math.max(player.w / 2, Math.min(W - player.w / 2, player.targetX));
    player.x += (player.targetX - player.x) * Math.min(1, dt * 14);

    for (let i = blocks.length - 1; i >= 0; i--) {
      const b = blocks[i];
      b.y += b.speed * dt;
      if (b.y > H + 40) { blocks.splice(i, 1); continue; }

      const py = H - 34;
      if (
        b.y + b.h > py &&
        b.y < py + player.h &&
        b.x + b.w > player.x - player.w / 2 &&
        b.x < player.x + player.w / 2
      ) {
        gameOver();
        return;
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
    }
  }

  function drawPlayer() {
    const py = H - 34;
    ctx.save();
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#00f0ff';
    roundRect(player.x - player.w / 2, py, player.w, player.h, 6);
    ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    let ox = 0, oy = 0;
    if (shakeT > 0) {
      ox = (Math.random() - 0.5) * 8 * shakeT;
      oy = (Math.random() - 0.5) * 8 * shakeT;
    }
    ctx.save();
    ctx.translate(ox, oy);

    // grid bg
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const gap = 28;
    for (let x = 0; x < W; x += gap) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gap) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // floor line
    ctx.strokeStyle = 'rgba(0,240,255,0.25)';
    ctx.beginPath();
    ctx.moveTo(0, H - 34);
    ctx.lineTo(W, H - 34);
    ctx.stroke();

    for (const b of blocks) {
      ctx.save();
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.restore();
    }

    for (const p of particles) {
      const alpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    drawPlayer();
    ctx.restore();
  }

  let lastTime = 0;
  function loop(ts) {
    if (!running) return;
    if (!lastTime) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    dt = Math.min(dt, 0.05);
    lastTime = ts;

    update(dt);
    draw();
    scoreEl.textContent = 'SCORE ' + score;

    if (running) requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    const py = H - 34;
    burst(player.x, py, '#00f0ff');
    draw();
    shakeT = 0.3;

    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    bestEl.textContent = 'BEST ' + best;

    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h1>GAME OVER</h1>
      <div class="sub">SCORE ${score}</div>
      <p>ベストスコア: ${best}</p>
      <button id="startBtn">もう一度</button>
    `;
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  function startGame() {
    resize();
    resetGame();
    overlay.classList.add('hidden');
    lastTime = 0;
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);

  // keyboard
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  // touch / mouse drag
  let dragging = false;
  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return clientX - rect.left;
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (!running) return;
    dragging = true;
    player.targetX = pointerX(e);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging || !running) return;
    player.targetX = pointerX(e);
  });
  window.addEventListener('pointerup', () => dragging = false);

  // init dummy state so resize works before first start
  keys = { left: false, right: false };
  resize();
  player = { x: W / 2, w: 34, h: 14, targetX: W / 2 };
  blocks = []; particles = [];
  draw();
})();
</script>
</body>
</html>
